name: smartgn-gateway
services:
  api-gateway:
    build: .
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    env_file: .env
    environment:
      API_PORT: 8000
      IAM_URL: http://host.docker.internal:18080
      INSTALLATION_URL: http://host.docker.internal:18081
      SUPPORT_URL: http://host.docker.internal:8082
      BILLING_URL: http://host.docker.internal:28083
    extra_hosts: ["host.docker.internal:host-gateway"]
    init: true
