openapi: 3.0.3
info:
  title: SmartGN API Gateway
  version: 0.1.0
  description: >
    Single entry point for the SmartGN web clients. The Gateway forwards requests
    unchanged to the owning microservice; the contract of each route is defined by that
    service. Protected routes require a Bearer JWT issued by the IAM service.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Gateway liveness
      security: []
      responses:
        '200': { description: Gateway is up }
  /api/v1/auth/sign-in:
    post:
      summary: Sign in (proxied to IAM)
      security: []
      responses:
        '200': { description: Token issued by IAM }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/activate-password:
    post: { summary: Proxied to IAM, security: [], responses: { '200': { description: OK } } }
  /api/v1/auth/forgot-password:
    post: { summary: Proxied to IAM, security: [], responses: { '200': { description: OK } } }
  /api/v1/auth/reset-password:
    post: { summary: Proxied to IAM, security: [], responses: { '200': { description: OK } } }
  /api/v1/installations:
    post: { summary: Public installation request (Installation service), security: [], responses: { '201': { description: Created } } }
  /api/v1/checkout/{path}:
    parameters: [{ name: path, in: path, required: true, schema: { type: string } }]
    post: { summary: Public checkout (Billing service), security: [], responses: { '200': { description: OK } } }
  /api/v1/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        description: >
          IAM: profiles, subusers. Installation: properties, supplypoints, installers
          (SUPERADMIN only), installations, devices, meters. Support: support.
          Billing: payment-methods, subscriptions, billing-documents, payments.
        schema: { type: string }
    get:
      summary: Any protected route (forwarded to the owning service)
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Controlled Gateway error
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: integer }
              error: { type: string }
              message: { type: string }
              correlationId: { type: string }
